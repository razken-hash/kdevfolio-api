server:
  port: ${PORT:8080}
  # Behind Render's proxy: let Tomcat resolve the real client IP from X-Forwarded-For.
  forward-headers-strategy: native

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  application:
    name: kDevFolio-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

analytics:
  # Comma-separated visitor UUIDs whose visits are not recorded.
  excluded-visitors: ${EXCLUDED_VISITORS:}

gemini:
  api-key: ${GOOGLE_API_KEY}
  model: ${GEMINI_MODEL:gemini-flash-latest}
